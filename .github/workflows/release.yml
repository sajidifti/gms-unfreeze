name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          SIGNING_KEYSTORE: ${{ runner.temp }}/release.jks
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          ./gradlew :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "gms-unfreeze-$VERSION_NAME.apk"
          sha256sum "gms-unfreeze-$VERSION_NAME.apk" > "gms-unfreeze-$VERSION_NAME.apk.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" gms-unfreeze-*.apk gms-unfreeze-*.apk.sha256 \
            --title "$GITHUB_REF_NAME" --generate-notes
