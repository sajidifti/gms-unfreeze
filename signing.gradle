// Shared by :app and :stub. Both must keep the same key across releases, or the
// app cannot update itself and the stub re-install fails with a signature mismatch.
// Release key comes from the environment (CI secrets); local builds fall back to the debug key.
def keystore = System.getenv("SIGNING_KEYSTORE")
def password = System.getenv("SIGNING_PASSWORD")

// "0.0.1" -> 1, "1.2.3" -> 10203
def versionNameEnv = System.getenv("VERSION_NAME") ?: "0.0.0-dev"
def parts = versionNameEnv.tokenize("-")[0].tokenize(".").collect { it as int } + [0, 0, 0]

android {
    defaultConfig {
        versionName versionNameEnv
        versionCode Math.max(1, parts[0] * 10000 + parts[1] * 100 + parts[2])
    }

    signingConfigs {
        release {
            if (keystore) {
                storeFile file(keystore)
                storePassword password
                keyAlias "release"
                keyPassword password
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystore ? signingConfigs.release : signingConfigs.debug
        }
    }
}
