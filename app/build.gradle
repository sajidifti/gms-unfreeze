plugins {
    id "com.android.application"
}

android {
    namespace "com.sajidifti.gmsunfreeze"
    compileSdk 36

    defaultConfig {
        applicationId "com.sajidifti.gmsunfreeze"
        minSdk 31
        targetSdk 36
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDirs += layout.buildDirectory.dir("stubAssets")
    }
}

apply from: rootProject.file("signing.gradle")

// Bundle the stub APK as assets/trigger.apk.
def copyStub = tasks.register("copyStub", Copy) {
    dependsOn ":stub:assembleRelease"
    from(project(":stub").layout.buildDirectory.file("outputs/apk/release/stub-release.apk"))
    into(layout.buildDirectory.dir("stubAssets"))
    rename { "trigger.apk" }
}
tasks.named("preBuild") { dependsOn copyStub }
